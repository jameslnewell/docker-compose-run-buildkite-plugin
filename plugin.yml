name: Docker Compose Run
description: Run a docker compose service with phase-level timing and automatic cleanup
author: https://github.com/jameslnewell
requirements:
  - docker
  - bash >= 3.2
configuration:
  properties:
    file:
      type:
        - string
        - array
      description: "Docker compose file(s)"
    service:
      type: string
      description: "Service to run (required)"
    command:
      type: array
      description: "Argv to pass as the service CMD. Each array item is one token, and an item may span multiple lines. Not wrapped in a shell unless the shell option names one."
    shell:
      type:
        - array
        - boolean
      description: "Shell to wrap the command in. The step's command defaults to [\"/bin/sh\", \"-e\", \"-c\"]; the plugin's command option is not wrapped unless this option names a shell, which is how a multi-line script is run. Set to false to pass BUILDKITE_COMMAND directly without a shell wrapper."
    workdir:
      type: string
      description: "Override working directory in the container"
    entrypoint:
      type: string
      description: "Override container entrypoint. Any value (including \"\") suppresses the default shell wrapping; setting the shell option explicitly turns it back on, matching the official buildkite docker plugin. Use \"\" to clear the image's ENTRYPOINT while passing plugin command args directly."
    environment:
      type: array
      description: "Environment variables as KEY=VALUE"
    volumes:
      type: array
      description: "Volume mounts as host:container. Host paths of . or starting with ./ are resolved against pwd."
    propagate-aws:
      type: boolean
      description: "Propagate AWS credential and region env vars (AWS_REGION, AWS_DEFAULT_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN)"
    propagate-buildkite-environment:
      type: boolean
      description: "Propagate CI, BUILDKITE and all BUILDKITE_* env vars from the host into the container"
  required:
    - service
  additionalProperties: false
